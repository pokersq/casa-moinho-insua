name: Otimizar fotos

on:
  push:
    branches: [main]
    paths: ["fotos/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install Pillow==11.0.0

      - run: python .github/scripts/optimize_images.py

      - name: Guardar fotos otimizadas
        run: |
          if git diff --quiet -- fotos; then
            echo "Nada a otimizar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fotos
          git commit -m "Otimizar fotos"
          git pull --rebase
          git push
